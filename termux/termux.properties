# Termux terminal configuration (deployed by bootstrap.sh Termux branch).
# Reference: https://wiki.termux.com/wiki/Terminal_Settings

# Extra keys rows for on-device use: ESC/CTRL/ALT + navigation keys.
# DRAWER opens the sessions drawer (the left-edge swipe conflicts with
# Android's back gesture); KEYBOARD toggles the soft keyboard.
extra-keys = [['ESC','/','-','HOME','UP','END','PGUP',{key: 'DRAWER', display: '☰'}],['TAB','CTRL','ALT','LEFT','DOWN','RIGHT','PGDN',{key: 'KEYBOARD', display: '⌨'}]]
